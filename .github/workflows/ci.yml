name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      # Each script fans out across packages/* and examples/*, building the
      # library first so the example can resolve it.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Print exactly what `npm publish` would ship, so a bad `files` entry or a
      # missing subpath declaration fails a PR instead of a release.
      - run: npm pack --dry-run -w @keydris/kit-reader
